<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2</title>
</head>

<body>
    <style>
        header {
            background-color: #333;
            height: 50px;
        }

        .bar {
            display: flex;
            justify-content: space-between;
        }

        .logo {
            color: white;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
            padding-left: 10px;
        }

        ul {
            margin: 0;
            padding: 0;
            margin-left: 30px;
            margin-top: 15px;
            padding-right: 10px;
        }

        li {
            display: inline;
        }

        li a {
            color: white;
            text-decoration: none;
        }

        #menu {
            display: none;
            color: white;
            font-size: 30px;
        }

        @media screen and (max-width: 768px) {

            ul {
                display: none;
            }

            #menu {
                display: block;
                padding-right: 15px;
            }

        }
    </style>
    </head>

    <body>

        <header>

            <div class="bar">

                <div class="logo">Logo</div>

                <nav>

                    <div id="menu">☰</div>

                    <ul>
                        <li><a href="#">Home</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Services</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>

                </nav>

            </div>

        </header>
    </body>

</html>
